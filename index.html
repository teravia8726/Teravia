<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TERAVIA - Marketplace Property Indonesia Berbasis AI & Ads</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/variable.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- Component CSS -->
    <link rel="stylesheet" href="components/navbar/navbar.css">
    <link rel="stylesheet" href="components/hero/hero.css">
    <link rel="stylesheet" href="components/city-categories/city-categories.css">
    <link rel="stylesheet" href="components/property-rekomendasi/property-rekomendasi.css">
    <link rel="stylesheet" href="components/property-terbaru/property-terbaru.css">
    <link rel="stylesheet" href="components/footer/footer.css">
    <link rel="stylesheet" href="components/auth/auth.css">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Hero -->
    <div id="hero"></div>

    <main class="main-container">

        <!-- City Categories -->
        <section id="city-categories"></section>

        <!-- Property Rekomendasi -->
        <section id="property-rekomendasi"></section>

        <!-- Property Terbaru -->
        <section id="property-terbaru"></section>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Auth -->
    <div id="auth"></div>

    <!-- Component JS -->
    <script src="components/navbar/navbar.js" defer></script>
    <script src="components/hero/hero.js" defer></script>
    <script src="components/city-categories/city-categories.js" defer></script>
    <script src="components/property-rekomendasi/property-rekomendasi.js" defer></script>
    <script src="components/property-terbaru/property-terbaru.js" defer></script>
    <script src="components/footer/footer.js" defer></script>
    <script src="components/auth/auth.js" defer></script>

    <!-- HTML Loader -->
    <script>
        async function include(id, file) {
            const res = await fetch(file);
            if (!res.ok) {
                document.getElementById(id).innerHTML =
                    `<!-- ${file} gagal dimuat -->`;
                return;
            }

            document.getElementById(id).innerHTML = await res.text();
        }

        Promise.all([
            include("navbar", "components/navbar/navbar.html"),
            include("hero", "components/hero/hero.html"),
            include("city-categories", "components/city-categories/city-categories.html"),
            include("property-rekomendasi", "components/property-rekomendasi/property-rekomendasi.html"),
            include("property-terbaru", "components/property-terbaru/property-terbaru.html"),
            include("footer", "components/footer/footer.html"),
            include("auth", "components/auth/auth.html")
        ]);
    </script>

</body>

</html>
