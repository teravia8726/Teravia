<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERAVIA - Marketplace Property Indonesia Berbasis AI & Ads</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/global.css">
    
    <!-- Component CSS -->
    <link rel="stylesheet" href="components/navbar/navbar.css">
    <link rel="stylesheet" href="components/auth/auth.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <!-- PLACEHOLDER KOMPONEN -->
    <div id="comp-navbar"></div>
    
    <main class="main-container">
        <div id="comp-hero"></div>
        <div id="comp-city-categories"></div>
        <div id="comp-rekomendasi"></div>
        <div id="comp-unggulan"></div>
    </main>

    <div id="comp-footer"></div>
    
    <!-- MODAL POPUP AUTH (LOGIN / REGISTER) -->
    <div id="comp-auth"></div>
      
    <!-- Component JS -->
    <script src="components/navbar/navbar.js"></script>
    <script src="components/auth/auth.js"></script>
    
    <!-- SCRIPT LOADER MODULAR -->
    <script>
        async function loadComponent(placeholderId, folderName, fileName) {
            try {
                // 1. Load HTML Component
                const htmlRes = await fetch(`components/${folderName}/${fileName}.html`);
                if (!htmlRes.ok) throw new Error(`Gagal memuat HTML: ${fileName}`);
                const htmlText = await htmlRes.text();
                
                const element = document.getElementById(placeholderId);
                if (element) {
                    element.innerHTML = htmlText;
                }

                // 2. Inject CSS secara otomatis jika belum di-link di <head>
                const existingCss = document.querySelector(`link[href="components/${folderName}/${fileName}.css"]`);
                if (!existingCss) {
                    const cssLink = document.createElement('link');
                    cssLink.rel = 'stylesheet';
                    cssLink.href = `components/${folderName}/${fileName}.css`;
                    document.head.appendChild(cssLink);
                }

                // 3. Inject JS secara otomatis jika belum dipanggil manual
                if (fileName !== 'navbar' && fileName !== 'auth') {
                    const jsPath = `components/${folderName}/${fileName}.js`;
                    const jsCheck = await fetch(jsPath, { method: 'HEAD' });
                    if (jsCheck.ok) {
                        const scriptTag = document.createElement('script');
                        scriptTag.src = jsPath;
                        document.body.appendChild(scriptTag);
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Panggil seluruh komponen saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('comp-navbar', 'navbar', 'navbar');
            loadComponent('comp-hero', 'hero', 'hero');
            loadComponent('comp-city-categories', 'city-categories', 'city-categories');
            loadComponent('comp-rekomendasi', 'property-rekomendasi', 'property-rekomendasi');
            loadComponent('comp-unggulan', 'property-unggulan', 'property-unggulan');
            loadComponent('comp-footer', 'footer', 'footer');
            loadComponent('comp-auth', 'auth', 'auth');
        });
    </script>
</body>
</html>
