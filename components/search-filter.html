<section class="search-filter">

    <div class="container">

        <div class="filter-wrapper">

            <div class="filter-item">

                <label for="transaction">
                    Transaksi
                </label>

                <select id="transaction">

                    <option value="">Semua</option>
                    <option value="jual">Jual</option>
                    <option value="sewa">Sewa</option>

                </select>

            </div>

            <div class="filter-item">

                <label for="category">
                    Kategori
                </label>

                <select id="category">

                    <option value="">Semua Properti</option>
                    <option>Rumah</option>
                    <option>Apartemen</option>
                    <option>Tanah</option>
                    <option>Ruko</option>
                    <option>Gudang</option>
                    <option>Villa</option>

                </select>

            </div>

            <div class="filter-item">

                <label for="location">
                    Lokasi
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Kota atau Kecamatan">

            </div>

            <div class="filter-item">

                <label for="price">
                    Harga Maksimal
                </label>

                <select id="price">

                    <option value="">Semua Harga</option>
                    <option>< Rp500 Juta</option>
                    <option>Rp500 Juta - Rp1 Miliar</option>
                    <option>Rp1 Miliar - Rp2 Miliar</option>
                    <option>Rp2 Miliar - Rp5 Miliar</option>
                    <option>> Rp5 Miliar</option>

                </select>

            </div>

            <div class="filter-item">

                <label>&nbsp;</label>

                <button
                    type="button"
                    class="btn btn-primary btn-search">

                    Cari Properti

                </button>

            </div>

        </div>

    </div>

</section>
