<!-- OVERLAY & MODAL AUTH -->
<div class="auth-overlay" id="authModal">
    <div class="auth-modal">
        <!-- Tombol Close -->
        <button class="auth-close-btn" onclick="closeAuthModal()">&times;</button>

        <!-- Header Brand -->
        <div class="auth-header">
            <img src="assets/images/logo.png" alt="TERAVIA Logo" class="auth-logo">
            <p class="auth-subtitle">Akses akun properti impianmu di sini</p>
        </div>

        <!-- Tab Switcher (Masuk / Daftar) -->
        <div class="auth-tabs">
            <button class="auth-tab-btn active" onclick="switchAuthTab('login')">Masuk</button>
            <button class="auth-tab-btn" onclick="switchAuthTab('register')">Daftar</button>
        </div>

        <!-- FORM 1: MASUK -->
        <form id="loginForm" class="auth-form active" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label>Email / Nomor HP</label>
                <div class="input-wrapper">
                    <i class="ph-bold ph-envelope-simple"></i>
                    <input type="text" placeholder="contoh@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Kata Sandi</label>
                <div class="input-wrapper">
                    <i class="ph-bold ph-lock-key"></i>
                    <input type="password" id="loginPass" placeholder="Masukkan kata sandi" required>
                    <i class="ph-bold ph-eye toggle-pass" onclick="togglePassword('loginPass', this)"></i>
                </div>
            </div>

            <div class="auth-flex-row">
                <label class="remember-me">
                    <input type="checkbox"> Ingat saya
                </label>
                <a href="#" class="forgot-pass">Lupa Sandi?</a>
            </div>

            <button type="submit" class="btn-auth-primary">Masuk Sekarang</button>
        </form>

        <!-- FORM 2: DAFTAR -->
        <form id="registerForm" class="auth-form" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label>Nama Lengkap</label>
                <div class="input-wrapper">
                    <i class="ph-bold ph-user"></i>
                    <input type="text" placeholder="Nama sesuai KTP" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="ph-bold ph-envelope-simple"></i>
                    <input type="email" placeholder="contoh@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Nomor WhatsApp</label>
                <div class="input-wrapper">
                    <i class="ph-bold ph-whatsapp-logo"></i>
                    <input type="tel" placeholder="0812345678xx" required>
                </div>
            </div>

            <div class="input-group">
                <label>Buat Kata Sandi</label>
                <div class="input-wrapper">
                    <i class="ph-bold ph-lock-key"></i>
                    <input type="password" id="regPass" placeholder="Minimal 8 karakter" required>
                    <i class="ph-bold ph-eye toggle-pass" onclick="togglePassword('regPass', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn-auth-primary">Buat Akun Gratis</button>
        </form>
    </div>
</div>
